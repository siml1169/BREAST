<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222B38"/>
      <stop offset="50%" stop-color="#181F2A"/>
      <stop offset="100%" stop-color="#0F141B"/>
    </linearGradient>

    <!-- Squircle Border Subtle Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B485A"/>
      <stop offset="100%" stop-color="#1B222D"/>
    </linearGradient>

    <!-- Cold Ambient Inflow Gradient (Cyan to Deep Blue) -->
    <linearGradient id="coldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E1FF"/>
      <stop offset="60%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="coldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70EFFF"/>
      <stop offset="100%" stop-color="#0077D4"/>
    </linearGradient>

    <!-- Warm Thermal Lift Gradient (Coral, Amber, Radiant Gold) -->
    <linearGradient id="warmGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>
    <linearGradient id="warmGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="60%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FFEA00"/>
    </linearGradient>

    <!-- Hub Glow & Core -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA040" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00B4D8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hubCenter" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3A4657"/>
      <stop offset="60%" stop-color="#232B36"/>
      <stop offset="100%" stop-color="#131920"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="bladeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#05080C" flood-opacity="0.6"/>
    </filter>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Badge Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Radial Background Energy Field -->
  <circle cx="256" cy="256" r="190" fill="url(#hubGlow)"/>

  <!-- Geometric Dual-Flow Inverter Turbine Group -->
  <g transform="translate(256, 256)" filter="url(#bladeShadow)">
    
    <!-- Outer Inverter Stator Arc Rings -->
    <circle cx="0" cy="0" r="185" fill="none" stroke="#2A3544" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.6"/>
    <circle cx="0" cy="0" r="165" fill="none" stroke="#374558" stroke-width="1.5" opacity="0.4"/>

    <!-- Cold Evaporator Intake Blades (Electric Cyan/Blue, Left/Top Quadrants) -->
    <!-- Blade 1: Top-Left Sweep -->
    <path d="M 0,0 
             C -45,-75 -125,-120 -165,-95 
             C -190,-80 -170,-25 -140,-5 
             C -100,20 -40,15 0,0 Z" 
          fill="url(#coldGrad1)" opacity="0.95"/>

    <!-- Blade 2: Far Left Downward Sweep -->
    <path d="M 0,0 
             C -80,-30 -160,-15 -175,25 
             C -185,55 -145,95 -115,100 
             C -75,105 -35,50 0,0 Z" 
          fill="url(#coldGrad2)" opacity="0.92"/>

    <!-- Blade 3: Bottom Left Counter-Vortex -->
    <path d="M 0,0 
             C -55,55 -95,130 -65,165 
             C -40,190 20,165 40,130 
             C 60,90 35,35 0,0 Z" 
          fill="url(#coldGrad1)" opacity="0.88"/>

    <!-- Dual-Flow Transition Blade: Top Vertical Interlock -->
    <path d="M 0,0 
             C -15,-80 5,-155 45,-175 
             C 75,-190 120,-145 125,-110 
             C 130,-70 65,-30 0,0 Z" 
          fill="url(#warmGrad2)" opacity="0.94"/>

    <!-- Warm Condenser Thermal Lift Blades (Coral, Amber, Radiant Gold, Right/Bottom Quadrants) -->
    <!-- Blade 4: Top-Right Expansive Flare -->
    <path d="M 0,0 
             C 55,-60 135,-85 170,-55 
             C 195,-30 185,35 150,65 
             C 110,95 45,45 0,0 Z" 
          fill="url(#warmGrad1)" opacity="0.96"/>

    <!-- Blade 5: Right Main Thermal Thrust -->
    <path d="M 0,0 
             C 75,20 155,50 165,95 
             C 175,130 130,175 95,175 
             C 55,170 20,100 0,0 Z" 
          fill="url(#warmGrad2)" opacity="0.95"/>

    <!-- Blade 6: Bottom-Right Underfloor Screed Storage Loop -->
    <path d="M 0,0 
             C 30,75 55,155 15,180 
             C -15,200 -70,165 -85,130 
             C -100,90 -45,40 0,0 Z" 
          fill="url(#warmGrad1)" opacity="0.93"/>

    <!-- Center Compressor Inverter Hub -->
    <circle cx="0" cy="0" r="54" fill="#0C1117" stroke="#3A4759" stroke-width="3"/>
    <circle cx="0" cy="0" r="46" fill="url(#hubCenter)"/>
    
    <!-- Inner High-Torque Inverter Core Ring -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#warmGrad1)" stroke-width="3.5" filter="url(#coreGlow)"/>
    <circle cx="0" cy="0" r="16" fill="#FFA040"/>
    <circle cx="-4" cy="-4" r="5" fill="#FFF2DF" opacity="0.9"/>
  </g>
</svg>
